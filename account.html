<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M.A.T.S Account</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f6f3f7;color:#222}.top{background:#6a3254;color:#fff;padding:20px;text-align:center}.wrap{max-width:720px;margin:25px auto;padding:15px}.box{background:#fff;padding:22px;border-radius:18px;box-shadow:0 8px 30px #0001;margin-bottom:15px}.tabs{display:flex;gap:8px}.tabs button{flex:1}.tab{padding:12px;border:0;border-radius:10px;background:#eee;font-weight:bold}.tab.active{background:#6a3254;color:#fff}input,textarea,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 12px;border-radius:10px;border:1px solid #ddd}button{background:#6a3254;color:#fff;border:0;font-weight:700;cursor:pointer}.outline{background:#fff;color:#6a3254;border:1px solid #6a3254}.msg{font-weight:700}.links{text-align:center;margin:15px}.links a{color:#6a3254;font-weight:700;text-decoration:none}.order{background:#faf7fa;border:1px solid #eadde6;padding:15px;border-radius:14px;margin:12px 0}.order img{width:75px;height:75px;object-fit:cover;border-radius:10px}.row{display:flex;gap:12px;align-items:flex-start}.status{display:inline-block;padding:5px 9px;border-radius:20px;background:#eee;font-size:12px;font-weight:bold}.muted{color:#666;font-size:13px}</style></head><body><div class="top"><h2>👤 M.A.T.S Account</h2></div><div class="wrap"><div id="logged" style="display:none"><div class="box"><h2>Welcome, <span id="who"></span> 👋</h2><p>Your account is ready for shopping.</p><button id="logout">Logout</button><button onclick="location.href='store.html'">🛍️ Store</button><button class="outline" onclick="loadOrders()">📦 View Ordered Items</button></div><div class="box"><h3>📦 My Ordered Items</h3><div id="orders">Click “View Ordered Items” to see your orders.</div></div></div><div id="auth"><div class="box"><div class="tabs"><button id="loginTab" class="tab active">Login</button><button id="createTab" class="tab">Create Account</button></div><div id="loginForm"><h3>Welcome Back</h3><input id="lphone" placeholder="Phone number"><input id="lpassword" type="password" placeholder="Password"><button id="loginBtn">Login</button><div id="lmsg" class="msg"></div></div><div id="createForm" style="display:none"><h3>Create New Account</h3><input id="cname" placeholder="Full name"><input id="cphone" placeholder="Phone number"><input id="cemail" type="email" placeholder="Email"><input id="cpassword" type="password" placeholder="Password (6+ characters)"><textarea id="caddress" placeholder="Address"></textarea><button id="createBtn">Create Account</button><div id="cmsg" class="msg"></div></div></div></div><div class="links"><a href="index.html">Home</a> · <a href="store.html">Store</a> · <a href="cart.html">Cart</a></div></div>
<script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js';import{getFirestore,collection,getDocs,query,where,doc,setDoc}from'https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js';const app=initializeApp({apiKey:'AIzaSyAwWqtyzIml5hlZpx4_R6IPhAH7KJ121s',authDomain:'mats-ac2b5.firebaseapp.com',projectId:'mats-ac2b5'}),db=getFirestore(app),$=id=>document.getElementById(id);async function hash(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function show(){let c=JSON.parse(localStorage.getItem('matsCustomer')||'null');if(c){$('auth').style.display='none';$('logged').style.display='block';$('who').textContent=c.name||c.phone}else{$('auth').style.display='block';$('logged').style.display='none'}}$('loginTab').onclick=()=>{$('loginTab').classList.add('active');$('createTab').classList.remove('active');$('loginForm').style.display='block';$('createForm').style.display='none'};$('createTab').onclick=()=>{$('createTab').classList.add('active');$('loginTab').classList.remove('active');$('createForm').style.display='block';$('loginForm').style.display='none'};$('createBtn').onclick=async()=>{let name=$('cname').value.trim(),phone=$('cphone').value.trim(),email=$('cemail').value.trim().toLowerCase(),password=$('cpassword').value,address=$('caddress').value.trim();if(!name||!phone||password.length<6)return $('cmsg').textContent='Enter name, phone and password (6+ characters).';try{let s=await getDocs(query(collection(db,'customers'),where('phone','==',phone)));if(!s.empty)return $('cmsg').textContent='Account already exists. Please use Login.';let r=doc(collection(db,'customers'));await setDoc(r,{id:r.id,name,phone,email,address,passwordHash:await hash(password),createdAt:new Date()});localStorage.setItem('matsCustomer',JSON.stringify({id:r.id,name,phone,email,address}));show();continueNext()}catch(e){$('cmsg').textContent='Could not create account: '+e.message}};$('loginBtn').onclick=async()=>{let phone=$('lphone').value.trim(),password=$('lpassword').value;if(!phone||!password)return $('lmsg').textContent='Enter phone and password.';try{let s=await getDocs(query(collection(db,'customers'),where('phone','==',phone)));if(s.empty)return $('lmsg').textContent='Account not found. Create an account instead.';let d=s.docs[0],x=d.data();if(x.passwordHash!==await hash(password))return $('lmsg').textContent='Incorrect password.';localStorage.setItem('matsCustomer',JSON.stringify({id:d.id,name:x.name||'',phone:x.phone||'',email:x.email||'',address:x.address||''}));show();continueNext()}catch(e){$('lmsg').textContent='Login failed: '+e.message}};function continueNext(){let n=new URLSearchParams(location.search).get('next');if(n==='checkout')location.href='checkout.html';else if(n==='cart')location.href='cart.html';else if(n==='buy')location.href='store.html';else loadOrders()}$('logout').onclick=()=>{localStorage.removeItem('matsCustomer');show();$('orders').innerHTML='';};window.loadOrders=async()=>{let c=JSON.parse(localStorage.getItem('matsCustomer')||'null');if(!c)return;$('orders').textContent='Loading...';try{let s=await getDocs(query(collection(db,'orders'),where('customerId','==',c.id)));if(s.empty){$('orders').innerHTML='<p>No orders yet.</p>';return}let arr=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));$('orders').innerHTML=arr.map(o=>`<div class="order"><p><b>Order ID:</b> ${esc(o.id)} <span class="status">${esc(o.status||'Pending')}</span></p>${(o.items||[]).map(i=>`<div class="row"><img src="${esc(i.imageData||'logo2.png')}"><div><b>${esc(i.name)}</b><br><span class="muted">${esc(i.description||'')}</span><br>Category: ${esc(i.category||'—')}<br>Price: ₹${Number(i.price||0).toFixed(2)} × ${Number(i.quantity||0)}<br>Item total: ₹${(Number(i.price||0)*Number(i.quantity||0)).toFixed(2)}</div></div>`).join('')}<hr><b>Subtotal:</b> ₹${Number(o.subtotal||0).toFixed(2)}<br><b>Discount:</b> ₹${Number(o.discount||0).toFixed(2)} ${o.coupon?`(${esc(o.coupon)})`:''}<br><b>Delivery:</b> ${Number(o.delivery||0)===0?'FREE':'₹'+Number(o.delivery||0).toFixed(2)}<br><b>Total:</b> ₹${Number(o.total||0).toFixed(2)}<br><b>Address:</b> ${esc(o.address||'—')}<br><b>Distance:</b> ${Number(o.distanceKm||0)} km</div>`).join('')}catch(e){$('orders').innerHTML='<p class="msg">Could not load orders: '+esc(e.message)+'</p>'}};show();if(JSON.parse(localStorage.getItem('matsCustomer')||'null'))loadOrders();</script></body></html>
