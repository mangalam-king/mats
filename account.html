<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M.A.T.S Account</title><style>body{margin:0;font-family:Arial;background:#f6f3f7;color:#222}.top{background:#6a3254;color:#fff;padding:18px;text-align:center}.box{max-width:480px;margin:30px auto;background:#fff;padding:24px;border-radius:18px;box-shadow:0 8px 30px #0001}input,textarea,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 14px;border-radius:10px;border:1px solid #ddd}button{background:#6a3254;color:#fff;border:0;font-weight:700}.msg{font-weight:700}.links{text-align:center}.links a{color:#6a3254;font-weight:700;text-decoration:none}</style></head><body><div class="top"><h2>👤 M.A.T.S Account</h2></div><div class="box"><div id="logged" style="display:none"><h3>Welcome, <span id="who"></span>!</h3><p>Your account is ready for shopping.</p><button id="logout">Logout</button><button onclick="location.href='store.html'">Go to Store</button></div><div id="form"><h3>Create Account / Login</h3><input id="name" placeholder="Full name"><input id="phone" placeholder="Phone number"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (6+ characters)"><textarea id="address" placeholder="Address"></textarea><button id="create">Create Account</button><button id="login">Login</button><div id="msg" class="msg"></div></div><div class="links"><a href="index.html">Home</a> · <a href="store.html">Store</a> · <a href="cart.html">Cart</a></div></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js';import{getFirestore,collection,getDocs,query,where,doc,setDoc}from'https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js';const app=initializeApp({apiKey:'AIzaSyAwWqtyzIml5hlZpx4_R6IPhAHk7KJ121s',authDomain:'mats-ac2b5.firebaseapp.com',projectId:'mats-ac2b5'}),db=getFirestore(app),$=id=>document.getElementById(id);async function hash(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}function show(){let c=JSON.parse(localStorage.getItem('matsCustomer')||'null');if(c){$('form').style.display='none';$('logged').style.display='block';$('who').textContent=c.name||c.phone}else{$('form').style.display='block';$('logged').style.display='none'}}$('create').onclick=async()=>{let name=$('name').value.trim(),phone=$('phone').value.trim(),email=$('email').value.trim().toLowerCase(),password=$('password').value,address=$('address').value.trim();if(!name||!phone||password.length<6)return $('msg').textContent='Enter name, phone and password (6+ chars).';try{let s=await getDocs(query(collection(db,'customers'),where('phone','==',phone)));if(!s.empty)return $('msg').textContent='Account already exists. Login instead.';let r=doc(collection(db,'customers'));await setDoc(r,{id:r.id,name,phone,email,address,passwordHash:await hash(password),createdAt:new Date()});localStorage.setItem('matsCustomer',JSON.stringify({id:r.id,name,phone,email,address}));show();location.href='store.html'}catch(e){$('msg').textContent='Could not create account: '+e.message}};$('login').onclick=async()=>{let phone=$('phone').value.trim(),password=$('password').value;if(!phone||!password)return $('msg').textContent='Enter phone and password.';try{let s=await getDocs(query(collection(db,'customers'),where('phone','==',phone)));if(s.empty)return $('msg').textContent='Account not found.';let d=s.docs[0],x=d.data();if(x.passwordHash!==await hash(password))return $('msg').textContent='Incorrect password.';localStorage.setItem('matsCustomer',JSON.stringify({id:d.id,name:x.name||'',phone:x.phone||'',email:x.email||'',address:x.address||''}));location.href='store.html'}catch(e){$('msg').textContent='Login failed: '+e.message}};$('logout').onclick=()=>{localStorage.removeItem('matsCustomer');show()};show();</script></body></html>
