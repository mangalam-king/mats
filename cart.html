<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M.A.T.S Cart</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f6f3f7}.head{background:#6a3254;color:white;padding:18px;text-align:center}.wrap{max-width:700px;margin:25px auto;padding:15px}.item,.total{background:white;padding:16px;border-radius:15px;margin:10px 0;box-shadow:0 4px 15px #0001}.btn{padding:10px;border:0;border-radius:10px;background:#6a3254;color:white;margin:4px;cursor:pointer}.checkout{width:100%;padding:14px;background:#6a3254;color:white;border:0;border-radius:12px;font-weight:bold}.links{text-align:center;margin:15px}.links a{color:#6a3254;font-weight:bold;text-decoration:none}.note{background:#fff4bd;padding:12px;border-radius:12px}</style></head><body><div class="head"><h2>🛒 Your Cart</h2></div><div class="wrap"><div class="note">Buy Now always orders only the product you clicked. Your cart is kept separately.</div><div id="box"></div><div class="links"><a href="store.html">← Store</a> · <a href="account.html">Account</a></div></div><script>const box=document.getElementById('box');function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){let c=JSON.parse(localStorage.getItem('matsCustomer')||'null');if(!c){box.innerHTML='<div class="item"><h3>🔐 Login required</h3><p>Please Login or Create Account before accessing your cart.</p><button class="checkout" onclick="location.href=\'account.html?next=cart\'">Login / Create Account</button></div>';return}let cart=JSON.parse(localStorage.getItem('matsCart')||'[]');if(!cart.length){box.innerHTML='<div class="item"><h3>Your cart is empty</h3><button class="checkout" onclick="location.href=\'store.html\'">Browse Store</button></div>';return}let total=cart.reduce((a,x)=>a+Number(x.price)*Number(x.quantity),0);box.innerHTML=cart.map((x,i)=>`<div class="item"><b>${esc(x.name)}</b><br>₹${Number(x.price).toFixed(2)} × ${x.quantity}<br><button class="btn" onclick="qty(${i},-1)">−</button><button class="btn" onclick="qty(${i},1)">+</button><button class="btn" onclick="removeItem(${i})">Remove</button><button class="btn" onclick="buyOne(${i})">⚡ Buy This</button></div>`).join('')+`<div class="total"><b>Cart value: ₹${total.toFixed(2)}</b><p>Use “Buy This” to order only that selected product.</p></div>`}function save(c){localStorage.setItem('matsCart',JSON.stringify(c));render()}window.qty=(i,n)=>{let c=JSON.parse(localStorage.getItem('matsCart')||'[]');c[i].quantity=Math.max(1,c[i].quantity+n);save(c)};window.removeItem=i=>{let c=JSON.parse(localStorage.getItem('matsCart')||'[]');c.splice(i,1);save(c)};window.buyOne=i=>{let c=JSON.parse(localStorage.getItem('matsCart')||'[]'),x=c[i];if(!x)return;localStorage.setItem('matsBuyNow',JSON.stringify({...x,description:'',category:'',imageData:''}));location.href='checkout.html'};render();</script></body></html>
