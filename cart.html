<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M.A.T.S Cart</title><style>body{margin:0;font-family:Arial;background:#f6f3f7}.head{background:#6a3254;color:white;padding:18px;text-align:center}.wrap{max-width:650px;margin:25px auto;padding:15px}.item,.total{background:white;padding:16px;border-radius:15px;margin:10px 0;box-shadow:0 4px 15px #0001}.btn{padding:10px;border:0;border-radius:10px;background:#6a3254;color:white;margin:4px}.checkout{width:100%;padding:14px;background:#6a3254;color:white;border:0;border-radius:12px;font-weight:bold}.links{text-align:center;margin:15px}.links a{color:#6a3254;font-weight:bold;text-decoration:none}</style></head><body><div class="head"><h2>🛒 Your Cart</h2></div><div class="wrap"><div id="box"></div><div class="links"><a href="store.html">← Continue Shopping</a> · <a href="account.html">Account</a></div></div><script>const box=document.getElementById('box');function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){let c=JSON.parse(localStorage.getItem('matsCustomer')||'null');if(!c){box.innerHTML='<div class="item"><h3>🔐 Login required</h3><p>Create an account or login before accessing your cart.</p><button class="checkout" onclick="location.href=\'account.html\'">Login / Create Account</button></div>';return}let cart=JSON.parse(localStorage.getItem('matsCart')||'[]');if(!cart.length){box.innerHTML='<div class="item"><h3>Your cart is empty</h3><button class="checkout" onclick="location.href=\'store.html\'">Browse Store</button></div>';return}let total=cart.reduce((a,x)=>a+Number(x.price)*Number(x.quantity),0);box.innerHTML=cart.map((x,i)=>`<div class="item"><b>${esc(x.name)}</b><br>₹${Number(x.price).toFixed(2)} × ${x.quantity}<br><button class="btn" onclick="qty(${i},-1)">−</button><button class="btn" onclick="qty(${i},1)">+</button><button class="btn" onclick="removeItem(${i})">Remove</button></div>`).join('')+`<div class="total"><b>Subtotal: ₹${total.toFixed(2)}</b><br><small>₹100+ orders get FREE delivery. Delivery below ₹100 is calculated at checkout.</small></div><button class="checkout" onclick="location.href='checkout.html'">Proceed to Checkout →</button>`}function save(c){localStorage.setItem('matsCart',JSON.stringify(c));render()}window.qty=(i,n)=>{let c=JSON.parse(localStorage.getItem('matsCart')||'[]');c[i].quantity=Math.max(1,c[i].quantity+n);save(c)};window.removeItem=i=>{let c=JSON.parse(localStorage.getItem('matsCart')||'[]');c.splice(i,1);save(c)};render();</script></body></html>
