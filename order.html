<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>M.A.T.S Webpage</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 0;
}
.header {
    text-align: center;
    padding: 20px;
    background: white;
}
.header img {
    width: 120px;
}
h1 {
    color: #6a3254;
}
.nav {
    text-align: center;
    background: yellow;
    padding: 15px;
    font-size: 20px;
}
.nav a {
    text-decoration: none;
    color: #6a3254;
    margin: 0 20px;
    font-weight: bold;
}
.container {
    max-width: 700px;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 0 10px #ccc;
}
label {
    font-weight: bold;
}
input, button {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    margin-bottom: 15px;
}
button {
    background: #6a3254;
    color: white;
    border: none;
    cursor: pointer;
    font-size: 16px;
}
button:hover {
    background: #532445;
}
.footer {
    text-align: center;
    padding: 20px;
    background: yellow;
    font-size: 18px;
}
</style>
</head>

<body>

<!-- Header -->
<div class="header">
    <img src="logo2.png">
    <h1>WELCOME TO M.A.T.S. WEBPAGE</h1>
</div>

<!-- Navigation -->
<div class="nav">
    <a href="index.html">Home Page</a>
    <a href="Read More.html">Read More & Contact</a>
</div>

<!-- Order Form -->
<div class="container">
    <h2>Order Registration</h2>

    <form action="https://formspree.io/f/meorjqoe" method="POST" id="orderForm">

        <label>Name:</label>
        <input type="text" name="name" required>

        <label>Phone no.:</label>
        <input type="tel" name="Phone no." required>

        <label>Item:</label>
        <input type="text" name="Item" required>

        <label>Quantity:</label>
        <input type="number" name="Quantity" required>

        <label>Address:</label>
        <input type="text" name="Address" required>

        <label>Email (optional):</label>
        <input type="email" name="Email">

        <button type="submit">Register Order</button>
    </form>
</div>

<!-- Enquiry Form -->
<div class="container">
    <h2>For Enquiry in MATS</h2>

    <form action="https://formspree.io/f/meorjqoe" method="POST" id="enquiryForm">

        <label>Name:</label>
        <input type="text" name="name" required>

        <label>Phone no.:</label>
        <input type="tel" name="Phone no." required>

        <label>DOB:</label>
        <input type="date" name="DOB" required>

        <label>Father's Name:</label>
        <input type="text" name="FATHERS NAME" required>

        <label>Address:</label>
        <input type="text" name="Address" required>

        <label>Email:</label>
        <input type="email" name="Email" required>

        <button type="submit">Register Information</button>
    </form>
</div>


<div class="container" id="shopSection">
<h2>Shop</h2>
<input id="shopSearch" placeholder="Search products..." oninput="renderProducts()">
<select id="shopCategory" onchange="renderProducts()"><option value="">All categories</option></select>
<div id="productsGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px"></div>
<h3>Cart</h3><div id="cartBox">Cart is empty</div>
<input id="couponInput" placeholder="Coupon code"><button type="button" onclick="applyCoupon()">Apply Coupon</button><div id="couponMsg"></div>
<div id="cartTotal" style="font-size:20px;font-weight:bold;margin:10px 0"></div>
<h3>Customer Account</h3>
<div id="accountBox" style="border:1px solid #ddd;padding:15px;border-radius:10px;margin-bottom:15px">
  <div id="accountLoggedOut">
    <p><b>Create an account or login before placing an order.</b></p>
    <input id="accountName" placeholder="Full name">
    <input id="accountPhone" placeholder="Phone number">
    <input id="accountEmail" type="email" placeholder="Email">
    <input id="accountPassword" type="password" placeholder="Password (minimum 6 characters)">
    <input id="accountAddress" placeholder="Address">
    <button type="button" onclick="createCustomerAccount()">Create Account</button>
    <button type="button" onclick="loginCustomerAccount()">Login</button>
    <div id="accountMsg"></div>
  </div>
  <div id="accountLoggedIn" style="display:none">
    <p>Logged in as <b id="accountDisplayName"></b></p>
    <button type="button" onclick="logoutCustomerAccount()">Logout</button>
  </div>
</div>
<h3>Checkout</h3>
<input id="shopName" placeholder="Name" required><input id="shopPhone" placeholder="Phone" required><input id="shopEmail" type="email" placeholder="Email (optional)"><textarea id="shopAddress" placeholder="Address" style="width:100%;min-height:80px" required></textarea>
<button type="button" onclick="placeShopOrder()">Place Shop Order</button><button type="button" onclick="shareLastOrder()">WhatsApp Last Order</button>
<div id="shopResult"></div>
</div>

<div class="container"><h2>My Orders</h2><input id="trackPhone" placeholder="Enter phone number"><button type="button" onclick="trackOrders()">Track Orders</button><div id="trackedOrders"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, query, where, runTransaction, doc, serverTimestamp, updateDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAwWqtyzIml5hlZpx4_R6IPhAHk7KJ121s",authDomain:"mats-ac2b5.firebaseapp.com",projectId:"mats-ac2b5"};
const app=initializeApp(firebaseConfig),db=getFirestore(app);let products=[],cart=JSON.parse(localStorage.getItem('matsCart')||'[]'),coupon=null,lastOrder=null,currentCustomer=JSON.parse(localStorage.getItem('matsCustomer')||'null');
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function hashPassword(text){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(text)).then(buf=>Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''));}
function showAccount(){
  const out=$('accountLoggedOut'), inn=$('accountLoggedIn');
  if(currentCustomer){out.style.display='none';inn.style.display='block';$('accountDisplayName').textContent=currentCustomer.name||currentCustomer.phone||'';['shopName','shopPhone','shopEmail','shopAddress'].forEach((id,i)=>{const v=[currentCustomer.name,currentCustomer.phone,currentCustomer.email,currentCustomer.address][i];});
    $('shopName').value=currentCustomer.name||'';$('shopPhone').value=currentCustomer.phone||'';$('shopEmail').value=currentCustomer.email||'';$('shopAddress').value=currentCustomer.address||'';
  }else{out.style.display='block';inn.style.display='none';}
}
window.createCustomerAccount=async()=>{
  const name=$('accountName').value.trim(),phone=$('accountPhone').value.trim(),email=$('accountEmail').value.trim().toLowerCase(),password=$('accountPassword').value,address=$('accountAddress').value.trim();
  if(!name||!phone||!password)return $('accountMsg').textContent='Enter name, phone and password.';
  if(password.length<6)return $('accountMsg').textContent='Password must be at least 6 characters.';
  try{
    const existing=await getDocs(query(collection(db,'customers'),where('phone','==',phone)));
    if(!existing.empty)return $('accountMsg').textContent='An account with this phone number already exists. Login instead.';
    const passwordHash=await hashPassword(password), ref=doc(collection(db,'customers'));
    const customer={id:ref.id,name,phone,email,address,passwordHash,createdAt:serverTimestamp()};
    await txSafeSet(ref,customer);
    currentCustomer={id:ref.id,name,phone,email,address};localStorage.setItem('matsCustomer',JSON.stringify(currentCustomer));showAccount();$('accountMsg').textContent='Account created successfully.';
  }catch(e){$('accountMsg').textContent='Could not create account: '+e.message;}
};
async function txSafeSet(ref,data){const {setDoc}=await import('https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js');return setDoc(ref,data);}
window.loginCustomerAccount=async()=>{
  const phone=$('accountPhone').value.trim(),password=$('accountPassword').value;
  if(!phone||!password)return $('accountMsg').textContent='Enter phone and password.';
  try{const s=await getDocs(query(collection(db,'customers'),where('phone','==',phone)));if(s.empty)return $('accountMsg').textContent='Account not found. Create an account first.';const d=s.docs[0],x=d.data(),hash=await hashPassword(password);if(x.passwordHash!==hash)return $('accountMsg').textContent='Incorrect password.';currentCustomer={id:d.id,name:x.name||'',phone:x.phone||'',email:x.email||'',address:x.address||''};localStorage.setItem('matsCustomer',JSON.stringify(currentCustomer));showAccount();$('accountMsg').textContent='Login successful.';}catch(e){$('accountMsg').textContent='Login failed: '+e.message;}
};
window.logoutCustomerAccount=()=>{currentCustomer=null;localStorage.removeItem('matsCustomer');showAccount();};
async function loadProducts(){const s=await getDocs(collection(db,'products'));products=s.docs.map(d=>({id:d.id,...d.data()}));const cats=[...new Set(products.map(x=>x.category).filter(Boolean))];$('shopCategory').innerHTML='<option value="">All categories</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');renderProducts();renderCart();}
window.renderProducts=()=>{const t=($('shopSearch').value||'').toLowerCase(),c=$('shopCategory').value;const arr=products.filter(x=>x.available!==false&&(!c||x.category===c)&&`${x.name} ${x.description} ${x.category}`.toLowerCase().includes(t));$('productsGrid').innerHTML=arr.map(x=>{const price=Number(x.discountPrice||x.price||0);return `<div style="border:1px solid #ddd;padding:12px;border-radius:10px"><img src="${esc(x.imageData||x.imageUrl||'logo2.png')}" style="width:100%;height:160px;object-fit:cover;border-radius:8px"><h3>${esc(x.name)}</h3><p>${esc(x.description)}</p><p><b>₹${price.toFixed(2)}</b> ${x.discountPrice?`<s>₹${Number(x.price).toFixed(2)}</s>`:''}</p><p>Stock: ${x.stock??0}</p><button onclick="addToCart('${x.id}')" ${Number(x.stock||0)<=0?'disabled':''}>Add to Cart</button><button onclick="buyNow('${x.id}')" ${Number(x.stock||0)<=0?'disabled':''}>Buy Now</button></div>`}).join('')||'<p>No products available.</p>';};
window.addToCart=id=>{const p=products.find(x=>x.id===id);if(!p)return;const old=cart.find(x=>x.id===id);if(old){if(old.quantity<p.stock)old.quantity++;}else cart.push({id,name:p.name,price:Number(p.discountPrice||p.price||0),quantity:1});saveCart();};window.buyNow=id=>{addToCart(id);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});};
function saveCart(){localStorage.setItem('matsCart',JSON.stringify(cart));renderCart();}
window.renderCart=()=>{if(!cart.length){$('cartBox').innerHTML='Cart is empty';$('cartTotal').textContent='';return;}$('cartBox').innerHTML=cart.map((x,i)=>`<div style="display:flex;gap:8px;align-items:center;margin:8px 0"><b>${esc(x.name)}</b> ₹${x.price.toFixed(2)} × <button onclick="changeQty(${i},-1)">−</button>${x.quantity}<button onclick="changeQty(${i},1)">+</button><button onclick="removeCart(${i})">Remove</button></div>`).join('');let sub=cart.reduce((a,x)=>a+x.price*x.quantity,0);let discount=coupon&&sub>=coupon.minOrder?sub*coupon.discount/100:0;let delivery=sub-discount>=500?0:50;$('cartTotal').textContent=`Subtotal ₹${sub.toFixed(2)} | Discount ₹${discount.toFixed(2)} | Delivery ₹${delivery.toFixed(2)} | Total ₹${(sub-discount+delivery).toFixed(2)}`;};window.changeQty=(i,d)=>{const p=products.find(x=>x.id===cart[i].id);cart[i].quantity=Math.max(1,Math.min(Number(p?.stock||999),cart[i].quantity+d));saveCart()};window.removeCart=i=>{cart.splice(i,1);saveCart()};
window.applyCoupon=async()=>{const code=$('couponInput').value.trim().toUpperCase();if(!code)return;const s=await getDocs(query(collection(db,'coupons'),where('code','==',code),where('active','==',true)));if(s.empty){coupon=null;$('couponMsg').textContent='Invalid coupon';}else{coupon=s.docs[0].data();$('couponMsg').textContent=`Coupon applied: ${coupon.discount}%`;};renderCart();};
window.placeShopOrder=async()=>{if(!cart.length)return alert('Cart is empty');if(!currentCustomer){$('accountMsg').textContent='Please create an account or login before ordering.';document.getElementById('accountBox').scrollIntoView({behavior:'smooth'});return;}const name=$('shopName').value.trim(),phone=$('shopPhone').value.trim(),address=$('shopAddress').value.trim();if(!name||!phone||!address)return alert('Enter name, phone and address');try{let result;await runTransaction(db,async tx=>{let sub=0;const refs=[];for(const item of cart){const r=doc(db,'products',item.id),snap=await tx.get(r);if(!snap.exists())throw new Error('Product no longer exists');const p=snap.data();if(Number(p.stock||0)<item.quantity)throw new Error(`Not enough stock for ${p.name}`);sub+=Number(p.discountPrice||p.price||0)*item.quantity;refs.push([r,p]);}let discount=coupon&&sub>=Number(coupon.minOrder||0)?sub*Number(coupon.discount||0)/100:0;let delivery=sub-discount>=500?0:50;let total=sub-discount+delivery;const orderRef=doc(collection(db,'orders'));result={id:orderRef.id,total};tx.set(orderRef,{customerId:currentCustomer.id,customerName:name,customerPhone:phone,customerEmail:$('shopEmail').value.trim(),address,items:cart.map(x=>({...x})),subtotal:sub,discount,delivery,total,status:'Pending',coupon:coupon?.code||'',createdAt:serverTimestamp()});for(const [r,p] of refs)tx.update(r,{stock:Number(p.stock)-cart.find(x=>x.id===r.id).quantity});});lastOrder=result;localStorage.setItem('matsLastOrder',JSON.stringify(result));cart=[];coupon=null;saveCart();$('shopResult').innerHTML=`<h3>Order placed!</h3><p>Order ID: <b>${esc(result.id)}</b></p><p>Total: ₹${result.total.toFixed(2)}</p><button type="button" onclick="printInvoice()">Print Invoice</button>`;loadProducts();}catch(e){alert(e.message)}};
window.printInvoice=()=>{if(!lastOrder)lastOrder=JSON.parse(localStorage.getItem('matsLastOrder')||'null');if(!lastOrder)return;const w=window.open('','_blank');w.document.write(`<html><body><h1>M.A.T.S Invoice</h1><p>Order ID: ${esc(lastOrder.id)}</p><p>Total: ₹${Number(lastOrder.total).toFixed(2)}</p><p>Thank you for your order.</p><script>window.print()<\/script></body></html>`);w.document.close();};window.shareLastOrder=()=>{const x=lastOrder||JSON.parse(localStorage.getItem('matsLastOrder')||'null');if(!x)return alert('Place an order first');window.open('https://wa.me/?text='+encodeURIComponent(`M.A.T.S Order ${x.id} Total ₹${x.total}`),'_blank')};
window.trackOrders=async()=>{const phone=$('trackPhone').value.trim();if(!phone)return;const s=await getDocs(query(collection(db,'orders'),where('customerPhone','==',phone)));$('trackedOrders').innerHTML=s.docs.map(d=>{const x=d.data();return `<div style="border:1px solid #ddd;padding:10px;margin:10px 0"><b>${esc(d.id)}</b><br>Status: <b>${esc(x.status)}</b><br>Total: ₹${Number(x.total||0).toFixed(2)}<br>${(x.items||[]).map(i=>esc(i.name)+' × '+i.quantity).join(', ')}</div>`}).join('')||'No orders found.';};showAccount();loadProducts();
</script>
<!-- Footer -->
<div class="footer">
    <a href="Read More.html">Read More & Contact</a>
</div>

<script>
// Store Order Form
document.getElementById("orderForm").addEventListener("submit", function() {
    let orders = JSON.parse(localStorage.getItem("matsOrders")) || [];

    const data = {
        name: this.elements["name"].value,
        phone: this.elements["Phone no."].value,
        item: this.elements["Item"].value,
        quantity: this.elements["Quantity"].value,
        address: this.elements["Address"].value,
        email: this.elements["Email"].value
    };

    orders.push(data);
    localStorage.setItem("matsOrders", JSON.stringify(orders));
});

// Store Enquiry Form
document.getElementById("enquiryForm").addEventListener("submit", function() {
    let enquiries = JSON.parse(localStorage.getItem("matsEnquiries")) || [];

    const data = {
        name: this.elements["name"].value,
        phone: this.elements["Phone no."].value,
        dob: this.elements["DOB"].value,
        father: this.elements["FATHERS NAME"].value,
        address: this.elements["Address"].value,
        email: this.elements["Email"].value
    };

    enquiries.push(data);
    localStorage.setItem("matsEnquiries", JSON.stringify(enquiries));
});
</script>

</body>
</html>
