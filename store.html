<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M.A.T.S Store</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f3f7;color:#222}.head{background:#6a3254;color:#fff;padding:16px;position:sticky;top:0;z-index:10}.head h2{margin:0 0 10px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;padding:8px 11px;border-radius:9px;background:#ffffff20}.wrap{max-width:1100px;margin:auto;padding:18px}.tools{display:flex;gap:10px}.tools>*{flex:1;padding:12px;border:1px solid #ddd;border-radius:12px;background:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px;margin-top:18px}.card{background:#fff;border-radius:18px;padding:12px;box-shadow:0 5px 20px #0000000d}.card img{width:100%;height:190px;object-fit:cover;border-radius:14px}.card h3{margin:10px 0 5px}.price{font-weight:800;color:#6a3254;font-size:20px}.old{color:#999;font-size:13px;margin-left:5px}.btn{width:100%;padding:11px;border:0;border-radius:11px;background:#6a3254;color:#fff;font-weight:700;margin-top:7px;cursor:pointer}.btn.alt{background:#222}.featured{background:#fff4bd;padding:12px;border-radius:12px;margin-top:15px;font-weight:700}.notice{padding:12px;background:#fff;border-radius:12px;margin-top:12px}.badge{display:inline-block;background:#f1d9e6;color:#6a3254;padding:5px 8px;border-radius:20px;font-size:12px;font-weight:bold}
</style></head><body>
<div class="head"><h2>🛍️ M.A.T.S Store</h2><div class="nav"><a href="index.html">Home</a><a href="cart.html">🛒 Cart</a><a href="account.html">👤 Account</a></div></div>
<div class="wrap"><div id="welcome" class="notice"></div><div class="tools"><input id="search" placeholder="Search products..."><select id="cat"><option value="">All categories</option></select></div><div id="featured"></div><div id="grid" class="grid">Loading...</div></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js';import{getFirestore,collection,getDocs}from'https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyAwWqtyzIml5hlZpx4_R6IPhAHk7KJ121s',authDomain:'mats-ac2b5.firebaseapp.com',projectId:'mats-ac2b5'}),db=getFirestore(app);let products=[];const $=id=>document.getElementById(id);const customer=()=>JSON.parse(localStorage.getItem('matsCustomer')||'null');
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function requireLogin(next){if(!customer()){alert('Please Login or Create Account first.');location.href='account.html?next='+encodeURIComponent(next);return false}return true}
window.buyNow=id=>{if(!requireLogin('buy'))return;const p=products.find(x=>x.id===id);if(!p||Number(p.stock||0)<=0)return alert('Out of stock');const item={id:p.id,name:p.name,description:p.description||'',category:p.category||'',imageData:p.imageData||'',price:Number(p.discountPrice||p.price||0),quantity:1};localStorage.setItem('matsBuyNow',JSON.stringify(item));location.href='checkout.html'};
window.add=id=>{if(!requireLogin('cart'))return;const p=products.find(x=>x.id===id);if(!p||Number(p.stock||0)<=0)return alert('Out of stock');let c=JSON.parse(localStorage.getItem('matsCart')||'[]'),i=c.find(x=>x.id===id);if(i)i.quantity=Math.min(Number(p.stock),i.quantity+1);else c.push({id:p.id,name:p.name,price:Number(p.discountPrice||p.price||0),quantity:1});localStorage.setItem('matsCart',JSON.stringify(c));alert('Added to cart');};
function render(){let s=$('search').value.toLowerCase(),c=$('cat').value,f=products.filter(p=>p.available!==false&&(!c||p.category===c)&&(`${p.name||''} ${p.description||''} ${p.category||''}`.toLowerCase().includes(s)));let ft=f.filter(p=>p.featured===true);$('featured').innerHTML=ft.length?'<div class="featured">⭐ Featured Products</div>':'';$('grid').innerHTML=f.length?f.map(p=>`<div class="card"><img src="${esc(p.imageData||'logo2.png')}" alt="${esc(p.name)}"><span class="badge">${esc(p.category||'Product')}</span><h3>${esc(p.name)}</h3><p>${esc(p.description||'')}</p><div class="price">₹${Number(p.discountPrice||p.price||0).toFixed(2)} ${p.discountPrice?`<span class="old"><s>₹${Number(p.price||0).toFixed(2)}</s></span>`:''}</div><small>Stock: ${Number(p.stock||0)}</small><button class="btn" onclick="buyNow('${p.id}')">⚡ Buy Now</button><button class="btn alt" onclick="add('${p.id}')">🛒 Add to Cart</button></div>`).join(''):'<div class="notice">No products found.</div>'}
async function load(){const s=await getDocs(collection(db,'products'));products=s.docs.map(d=>({id:d.id,...d.data()}));const cats=[...new Set(products.map(p=>p.category).filter(Boolean))];$('cat').innerHTML='<option value="">All categories</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');const c=customer();$('welcome').innerHTML=c?`Welcome, <b>${esc(c.name)}</b> 👋 — Buy Now opens checkout for only that product.`:'🔐 Login or create an account before using Buy Now or Cart.';render()}$('search').oninput=render;$('cat').onchange=render;load();
</script></body></html>
